name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Ruff
        run: uv run ruff check src tests evaluation scripts
      - name: Ruff format
        run: uv run ruff format --check src tests evaluation scripts
      - name: Pytest
        run: uv run pytest -q

  dashboard:
    name: Dashboard tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: engine-dashboard/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test
        run: npm test -- --watchAll=false
        env:
          CI: "true"
      - name: Build
        run: npm run build
        env:
          CI: "true"

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    needs:
      - backend
      - dashboard
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config -q
      - name: Build images
        run: docker compose build
