name: Bug Report
description: File a bug report
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a bug. Please fill in the details below.
  - type: input
    id: version
    attributes:
      label: Version / Commit Hash
      placeholder: e.g. v0.1.0-developer-preview / 2558c09
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python version, Model/Provider settings
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add logs, screenshots, failing tests, or other proof. Remove secrets and sensitive content.
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Describe security, privacy, data-loss, reliability, or user impact.
