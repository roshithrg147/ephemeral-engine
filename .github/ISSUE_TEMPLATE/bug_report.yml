name: Bug Report
description: File a bug report
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a bug. Please fill in the details below.
  - type: input
    id: version
    attributes:
      label: Version / Commit Hash
      placeholder: e.g. v0.1.0-developer-preview / 2558c09
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python version, Model/Provider settings
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
