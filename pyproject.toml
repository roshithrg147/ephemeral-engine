[project]
name = "ephemeral-engine"
version = "0.1.0"
description = "Session-isolated context-control middleware for multi-turn AI applications."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
    "pydantic>=2.5.0",
    "chromadb>=1.5.9",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.0.0",
    "filelock>=3.12.0",
]

[project.optional-dependencies]
clipboard = [
    "cryptography>=41.0.0",
    "Pillow>=9.0.0",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "pystray>=0.19.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.12.0",
]

[project.scripts]
assistant = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
exclude = ["src/tests/**"]

[tool.pytest.ini_options]
addopts = "-m 'not live and not network'"
testpaths = ["src/tests", "evaluation"]
markers = [
    "live: requires a separately running SC-EVM backend and configured provider",
    "network: opens localhost sockets or calls network services",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["evaluation-results", "graphify-out", "engine-dashboard"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
